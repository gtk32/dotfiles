force_keyboard_focus = true     # forces keyboard forcus to stay in Walker
click_to_close = true           # closes walker if clicking outside of the main content area
single_click_activation = true  # activate items with a single click opposed to a double click
selection_wrap = true           # wrap list if at bottom or top
global_argument_delimiter = "#" # query: firefox#https://benz.dev
theme = "cli"       # theme to use
disable_mouse = false           # disable mouse (on input and list only)
debug = false                   # enables debug printing for some stuff, f.e. keybinds
page_jump_items = 10            # number of items to skip with Page Up/Down
hide_quick_activation = true   # globally hide the quick activation buttons
hide_action_hints = true       # globally hide the action hints
hide_action_hints_dmenu = true  # hide the actions hints for dmenu
hide_return_action = true      # hide actions that are bound to Return

[placeholders]
"default" = { input = " Search...", list = "No Results" }

[columns]
"symbols" = 3


[keybinds]
close = ["Escape"]
next = ["Down"]
previous = ["Up"]
left = ["Left"]
right = ["Right"]
down = ["Down"]
up = ["Up"]
resume_last_query = ["ctrl r"]
page_down = ["Page_Down"]
page_up = ["Page_Up"]

[providers]# providers to be queried by default
default = [
  "desktopapplications",
]
empty = ["desktopapplications"] # providers to be queried when query is empty
ignore_preview = [] # providers that should not show previews
max_results = 100 # global max results

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = ":"
provider = "runner"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ">"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "!"
provider = "windows"
